<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cellnex AR Roma EUR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0D1B1E;
    }

    #start-screen {
      position: fixed;
      inset: 0;
      background: #0D1B1E;
      color: white;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    #start-screen h1 {
      color: #00AEAE;
      font-size: 34px;
      margin-bottom: 18px;
    }

    #start-screen p {
      font-size: 18px;
      line-height: 1.5;
      max-width: 340px;
      margin-bottom: 30px;
    }

    #start-screen button {
      background: #00AEAE;
      color: white;
      border: none;
      padding: 16px 28px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    #ar-container {
      display: none;
    }

    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 999;
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="start-screen">
  <h1>Cellnex AR</h1>
  <p>Inquadra il panorama Cellnex di fronte a te</p>
  <button onclick="startAR()">Avvia visione AR</button>
</div>

<div id="ar-container">
  <div id="info">Inquadra il palazzo davanti a te</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- BAXTER / VIALE DELL'INDUSTRIA 40 -->
    <a-image 
      src="cellnex-telecom-logotransparent.png"
      gps-entity-place="latitude: 41.8360486; longitude: 12.4745147;"
      scale="4 1.6 1"
      position="0 1 0"
      rotation="0 180 0"
      look-at="[gps-camera]">
    </a-image>

    <!-- PIAZZALE DELL'INDUSTRIA 8 -->
    <a-image 
      src="cellnex-telecom-logotransparent.png"
      gps-entity-place="latitude: 41.83705; longitude: 12.47485;"
      scale="4 1.6 1"
      position="0 1 0"
      rotation="0 180 0"
      look-at="[gps-camera]">
    </a-image>

    <a-camera gps-camera rotation-reader></a-camera>

  </a-scene>
</div>

<script>
  function startAR() {
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("ar-container").style.display = "block";
  }
</script>

</body>
</html>
