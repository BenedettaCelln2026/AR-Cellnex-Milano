<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cellnex AR Milano</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>

<a-scene embedded arjs="sourceType: webcam;">

  <!-- UNICREDIT -->
  <a-image src="cellnex-logo.png"
    gps-entity-place="latitude: 45.4833; longitude: 9.1900;"
    scale="30 10 10"
    look-at="[gps-camera]">
  </a-image>

  <!-- BOSCO VERTICALE -->
  <a-image src="cellnex-logo.png"
    gps-entity-place="latitude: 45.4858; longitude: 9.1903;"
    scale="30 10 10"
    look-at="[gps-camera]">
  </a-image>

  <!-- TORRE DIAMANTE -->
  <a-image src="cellnex-logo.png"
    gps-entity-place="latitude: 45.4805; longitude: 9.1961;"
    scale="30 10 10"
    look-at="[gps-camera]">
  </a-image>

  <!-- PWC -->
  <a-image src="cellnex-logo.png"
    gps-entity-place="latitude: 45.4777; longitude: 9.1569;"
    scale="30 10 10"
    look-at="[gps-camera]">
  </a-image>

  <a-camera gps-camera rotation-reader></a-camera>

</a-scene>

</body>
</html>
