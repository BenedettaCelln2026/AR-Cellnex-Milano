<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cellnex AR Roma EUR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- BAXTER SPA / VIALE DELL'INDUSTRIA 40 -->
  <a-image 
    src="cellnex-telecom-logotransparent.png"
    gps-entity-place="latitude: 41.8360486; longitude: 12.4745147;"
    scale="10 4 1"
    position="0 35 0"
    rotation="0 180 0"
    look-at="[gps-camera]">
  </a-image>

  <!-- PIAZZALE DELL'INDUSTRIA 8 -->
  <a-image 
    src="cellnex-telecom-logotransparent.png"
    gps-entity-place="latitude: 41.83705; longitude: 12.47485;"
    scale="10 4 1"
    position="0 35 0"
    rotation="0 180 0"
    look-at="[gps-camera]">
  </a-image>

  <a-camera gps-camera rotation-reader></a-camera>

</a-scene>

</body>
</html>
