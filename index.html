<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Cellnex AR</title>

  <!-- A-Frame -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.5.0/aframe.min.js"></script>

  <!-- MindAR image tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* ── RESET ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cx-teal:    #00B2B2;
      --cx-teal2:   #00D4D4;
      --cx-green:   #6DC82A;
      --cx-dark:    #07181A;
      --cx-mid:     #0D2428;
      --cx-white:   #FFFFFF;
      --cx-muted:   rgba(255,255,255,0.45);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--cx-dark);
      color: var(--cx-white);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ══════════════════════════════════════
       SPLASH SCREEN
    ══════════════════════════════════════ */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 2rem 3rem;
      background: var(--cx-dark);
      /* Subtle mesh background */
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,178,178,.12) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 100%, rgba(109,200,42,.06) 0%, transparent 60%);
      transition: opacity .5s ease, transform .5s ease;
    }

    #splash.hidden {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }

    /* Grid lines decoration */
    #splash::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,178,178,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,178,178,.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ── Logo mark ── */
    .splash-logo {
      position: relative;
      margin-bottom: 2.8rem;
      animation: logoIn .9s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes logoIn {
      from { opacity: 0; transform: translateY(-24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Halo ring behind logo */
    .splash-logo::before {
      content: '';
      position: absolute;
      inset: -28px;
      border-radius: 50%;
      border: 1px solid rgba(0,178,178,.2);
      animation: haloSpin 8s linear infinite;
    }
    .splash-logo::after {
      content: '';
      position: absolute;
      inset: -46px;
      border-radius: 50%;
      border: 1px dashed rgba(0,178,178,.1);
      animation: haloSpin 14s linear infinite reverse;
    }

    @keyframes haloSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Cellnex logo SVG */
    .cx-logo-svg {
      display: block;
      width: 160px;
      filter: drop-shadow(0 0 18px rgba(0,178,178,.45));
    }

    /* ── Title ── */
    .splash-eyebrow {
      font-size: .62rem;
      letter-spacing: .3em;
      color: var(--cx-teal);
      text-transform: uppercase;
      margin-bottom: .6rem;
      animation: fadeUp .7s .15s both;
    }

    .splash-title {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -.01em;
      line-height: 1.1;
      text-align: center;
      margin-bottom: 1rem;
      animation: fadeUp .7s .2s both;
    }

    .splash-title span { color: var(--cx-teal); }

    .splash-desc {
      font-size: .88rem;
      font-weight: 300;
      color: var(--cx-muted);
      text-align: center;
      line-height: 1.8;
      max-width: 300px;
      margin-bottom: 2.8rem;
      animation: fadeUp .7s .28s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── CTA Button ── */
    .cta-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: .7rem;
      background: var(--cx-teal);
      color: var(--cx-dark);
      border: none;
      padding: 1rem 2.2rem;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
      overflow: hidden;
      animation: fadeUp .7s .38s both;
      transition: transform .15s, box-shadow .25s;
      box-shadow: 0 0 0 0 rgba(0,178,178,.5);
    }

    .cta-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.15) 0%, transparent 60%);
      pointer-events: none;
    }

    .cta-btn:hover, .cta-btn:active {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,178,178,.45);
    }

    .cta-icon {
      width: 20px; height: 20px;
      display: grid; place-items: center;
    }

    /* Pulse ring on button */
    .cta-pulse {
      position: absolute;
      inset: -4px;
      border-radius: 9px;
      border: 2px solid rgba(0,178,178,.5);
      animation: pulseCta 2.4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes pulseCta {
      0%,100% { transform: scale(1); opacity: .6; }
      50%     { transform: scale(1.06); opacity: 0; }
    }

    /* ── Step hints ── */
    .steps {
      position: absolute;
      bottom: 2rem;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      animation: fadeUp .7s .5s both;
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .35rem;
    }

    .step-icon {
      width: 36px; height: 36px;
      border: 1px solid rgba(0,178,178,.3);
      border-radius: 8px;
      display: grid;
      place-items: center;
    }

    .step-label {
      font-size: .55rem;
      letter-spacing: .12em;
      color: var(--cx-muted);
      text-transform: uppercase;
      text-align: center;
      max-width: 70px;
    }

    /* ══════════════════════════════════════
       AR HUD  (overlay on top of A-Frame)
    ══════════════════════════════════════ */
    #ar-hud {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      display: none;
    }

    /* Top bar */
    .hud-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: env(safe-area-inset-top, 1.2rem) 1.4rem 1rem;
      padding-top: max(env(safe-area-inset-top), 1.2rem);
      background: linear-gradient(to bottom, rgba(7,24,26,.75) 0%, transparent 100%);
    }

    .cx-logo-small {
      width: 88px;
      filter: drop-shadow(0 0 6px rgba(0,178,178,.3));
    }

    .live-pill {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .58rem;
      letter-spacing: .2em;
      color: var(--cx-teal);
      text-transform: uppercase;
      background: rgba(0,178,178,.1);
      border: 1px solid rgba(0,178,178,.3);
      padding: .3rem .65rem;
      border-radius: 20px;
    }

    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--cx-green);
      animation: blink 1.5s infinite;
    }
    @keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:.2; } }

    /* Scan corners */
    .scan-frame {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(260px, 70vw);
      height: min(260px, 70vw);
    }

    .sc {
      position: absolute;
      width: 22px; height: 22px;
      border-color: rgba(0,178,178,.65);
      border-style: solid;
    }
    .sc.tl { top: 0; left: 0;  border-width: 2.5px 0 0 2.5px; }
    .sc.tr { top: 0; right: 0; border-width: 2.5px 2.5px 0 0; }
    .sc.bl { bottom: 0; left: 0;  border-width: 0 0 2.5px 2.5px; }
    .sc.br { bottom: 0; right: 0; border-width: 0 2.5px 2.5px 0; }

    .scan-sweep {
      position: absolute;
      left: 0; right: 0;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(0,178,178,.9), transparent);
      animation: sweep 2.5s linear infinite;
    }
    @keyframes sweep { 0%{ top:0; } 100%{ top:100%; } }

    /* Bottom hint */
    .hud-hint {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 2rem);
      bottom: max(env(safe-area-inset-bottom), 2rem);
      left: 0; right: 0;
      text-align: center;
      font-size: .68rem;
      letter-spacing: .14em;
      color: rgba(255,255,255,.45);
      text-transform: uppercase;
      padding: 0 2rem;
    }

    /* ── Tracking status toast ── */
    #track-toast {
      position: absolute;
      bottom: 5rem;
      left: 50%; transform: translateX(-50%);
      background: rgba(0,178,178,.18);
      border: 1px solid rgba(0,178,178,.4);
      backdrop-filter: blur(8px);
      padding: .55rem 1.2rem;
      border-radius: 20px;
      font-size: .68rem;
      letter-spacing: .12em;
      color: var(--cx-teal);
      text-transform: uppercase;
      white-space: nowrap;
      transition: opacity .4s;
    }

    #track-toast.found { color: var(--cx-green); border-color: rgba(109,200,42,.5); }

    /* ══════════════════════════════════════
       A-Frame canvas fix
    ══════════════════════════════════════ */
    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════
     SPLASH
══════════════════════════════════════════ -->
<div id="splash">

  <div class="splash-logo">
    <svg class="cx-logo-svg" viewBox="0 0 240 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Signal circles -->
      <circle cx="28" cy="36" r="24" stroke="#00B2B2" stroke-width="2.5" fill="none" opacity=".2"/>
      <circle cx="28" cy="36" r="15" stroke="#00B2B2" stroke-width="2.5" fill="none" opacity=".4"/>
      <circle cx="28" cy="36" r="7"  fill="#00B2B2"/>
      <!-- wordmark -->
      <text x="60" y="47"
        fill="#FFFFFF"
        font-size="28"
        font-weight="700"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        letter-spacing="-0.5">cellnex</text>
      <!-- wifi top-right -->
      <path d="M214 18 Q224 10 234 18" stroke="#00B2B2" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M218 25 Q224 19 230 25" stroke="#00B2B2" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="224" cy="31" r="2.8" fill="#00B2B2"/>
    </svg>
  </div>

  <div class="splash-eyebrow">Augmented Reality Experience</div>
  <h1 class="splash-title">Cellnex <span>AR</span></h1>
  <p class="splash-desc">
    Inquadra il panorama Cellnex di fronte a te e scopri la rete in realtà aumentata.
  </p>

  <button class="cta-btn" id="start-btn">
    <div class="cta-pulse"></div>
    <span class="cta-icon">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <circle cx="9" cy="9" r="8" stroke="#07181A" stroke-width="1.5"/>
        <path d="M7 5.5L13 9L7 12.5V5.5Z" fill="#07181A"/>
      </svg>
    </span>
    Avvia visione AR
  </button>

  <div class="steps">
    <div class="step">
      <div class="step-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="2" y="1" width="12" height="14" rx="2" stroke="#00B2B2" stroke-width="1.3"/>
          <circle cx="8" cy="11.5" r="1" fill="#00B2B2"/>
        </svg>
      </div>
      <span class="step-label">Consenti fotocamera</span>
    </div>
    <div class="step">
      <div class="step-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="4" width="14" height="9" rx="1.5" stroke="#00B2B2" stroke-width="1.3"/>
          <circle cx="8" cy="8.5" r="2" stroke="#00B2B2" stroke-width="1.3"/>
        </svg>
      </div>
      <span class="step-label">Inquadra l'edificio</span>
    </div>
    <div class="step">
      <div class="step-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 8L6.5 11.5L13 4.5" stroke="#6DC82A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="step-label">Logo in AR</span>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     AR HUD
══════════════════════════════════════════ -->
<div id="ar-hud">
  <div class="hud-bar">
    <svg class="cx-logo-small" viewBox="0 0 240 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="28" cy="36" r="24" stroke="#00B2B2" stroke-width="2.5" fill="none" opacity=".2"/>
      <circle cx="28" cy="36" r="15" stroke="#00B2B2" stroke-width="2.5" fill="none" opacity=".4"/>
      <circle cx="28" cy="36" r="7" fill="#00B2B2"/>
      <text x="60" y="47" fill="#FFFFFF" font-size="28" font-weight="700"
            font-family="Helvetica Neue, Helvetica, Arial, sans-serif" letter-spacing="-0.5">cellnex</text>
      <path d="M214 18 Q224 10 234 18" stroke="#00B2B2" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M218 25 Q224 19 230 25" stroke="#00B2B2" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="224" cy="31" r="2.8" fill="#00B2B2"/>
    </svg>
    <div class="live-pill">
      <div class="live-dot"></div>
      AR Live
    </div>
  </div>

  <div class="scan-frame">
    <div class="sc tl"></div>
    <div class="sc tr"></div>
    <div class="sc bl"></div>
    <div class="sc br"></div>
    <div class="scan-sweep"></div>
  </div>

  <div class="hud-hint">Punta verso il panorama Cellnex</div>

  <div id="track-toast">&#9675;&nbsp; Ricerca target in corso…</div>
</div>

<!-- ══════════════════════════════════════════
     A-FRAME SCENE  (nascosta finché non si preme il bottone)
══════════════════════════════════════════ -->
<a-scene
  id="ar-scene"
  mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.001; filterBeta: 1000; warmupTolerance: 1; missTolerance: 5"
  color-space="sRGB"
  embedded
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  style="display:none;"
>
  <a-assets>
    <img id="cellnex-logo" src="cellnex-telecom-logotransparent.png" crossorigin="anonymous" />
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!--
    Target 0 = prima immagine nel file targets.mind
    Il logo viene posizionato SOPRA il target:
      - position="0 0.6 0"  → alzato rispetto al centro del target
      - height dipende dall'aspect ratio del logo (es. 4:1 → width=1, height=0.25)
      - scale regolato per coprire l'area dell'edificio in modo proporzionato
  -->
  <a-entity mindar-image-target="targetIndex: 0">

    <!-- Logo principale: centrato e alzato sul target -->
    <a-image
      src="#cellnex-logo"
      position="0 0.55 0"
      width="1.2"
      height="0.36"
      rotation="0 0 0"
      transparent="true"
      opacity="1"
      material="alphaTest: 0.01; transparent: true; side: double"
    ></a-image>

    <!-- Sottile piano di ancoraggio visivo (facoltativo - debug) -->
    <!--
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="1" height="1"
      color="#00B2B2"
      opacity="0.05"
      material="side: double"
    ></a-plane>
    -->

  </a-entity>

</a-scene>

<!-- ══════════════════════════════════════════
     JAVASCRIPT
══════════════════════════════════════════ -->
<script>
  const splash    = document.getElementById('splash');
  const startBtn  = document.getElementById('start-btn');
  const arScene   = document.getElementById('ar-scene');
  const arHud     = document.getElementById('ar-hud');
  const toast     = document.getElementById('track-toast');
  const scanFrame = document.querySelector('.scan-frame');

  let mindARStarted = false;

  // ── Avvio ──────────────────────────────────────────────────────────────────
  startBtn.addEventListener('click', async () => {
    // Richiedi permesso camera prima di mostrare la scena
    try {
      await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    } catch (e) {
      alert('Fotocamera non accessibile. Consenti l\'accesso e ricarica la pagina.');
      return;
    }

    // Mostra scena A-Frame
    arScene.style.display = 'block';

    // Nascondi splash con transizione
    splash.classList.add('hidden');

    // Mostra HUD
    setTimeout(() => {
      arHud.style.display = 'block';
    }, 350);

    // Avvia MindAR dopo un frame
    setTimeout(() => {
      if (!mindARStarted) {
        mindARStarted = true;
        arScene.systems['mindar-image-system'].start();
      }
    }, 400);
  });

  // ── Tracking events ────────────────────────────────────────────────────────
  arScene.addEventListener('loaded', () => {
    const target = arScene.querySelector('[mindar-image-target]');
    if (!target) return;

    target.addEventListener('targetFound', () => {
      toast.textContent = '✓ Target riconosciuto';
      toast.classList.add('found');
      scanFrame.style.opacity = '0';
    });

    target.addEventListener('targetLost', () => {
      toast.textContent = '○ Ricerca target in corso…';
      toast.classList.remove('found');
      scanFrame.style.opacity = '1';
    });
  });

  // ── Prevenire scroll/zoom ──────────────────────────────────────────────────
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>

</body>
</html>
