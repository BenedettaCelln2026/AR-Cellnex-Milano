<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cellnex AR Roma EUR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- AFRAME -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.JS -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 999;
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="info">
  Inquadra il palazzo davanti a te
</div>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- PALAZZO PRINCIPALE (BAXTER / EUR) -->
  <a-image 
    src="cellnex-telecom-logotransparent.png"
    gps-entity-place="latitude: 41.8360486; longitude: 12.4745147;"
    
    scale="5 2 1"
    position="0 6 0"
    
    rotation="0 180 0"
    look-at="[gps-camera]">
  </a-image>

  <!-- SECONDO PALAZZO DAVANTI -->
  <a-image 
    src="cellnex-telecom-logotransparent.png"
    gps-entity-place="latitude: 41.83705; longitude: 12.47485;"
    
    scale="5 2 1"
    position="0 6 0"
    
    rotation="0 180 0"
    look-at="[gps-camera]">
  </a-image>

  <!-- CAMERA -->
  <a-camera gps-camera rotation-reader></a-camera>

</a-scene>

</body>
</html>
