<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Cellnex AR</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #07181A;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      width: 100%; height: 100dvh;
    }

    /* ── SPLASH ── */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #07181A; padding: 2rem;
      transition: opacity .4s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }

    #splash svg.logo { width: 180px; margin-bottom: 2.5rem; filter: drop-shadow(0 0 18px rgba(0,178,178,.5)); }
    #splash h1 { font-size: 2rem; font-weight: 700; color: #fff; margin-bottom: .5rem; }
    #splash h1 span { color: #00B2B2; }
    #splash p { font-size: .88rem; color: rgba(255,255,255,.5); text-align: center; max-width: 280px; margin-bottom: 2.5rem; line-height: 1.8; }

    #start-btn {
      background: #00B2B2; color: #07181A;
      border: none; border-radius: 6px;
      padding: 1rem 2.5rem;
      font-size: .9rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      cursor: pointer; transition: background .2s;
    }
    #start-btn:hover { background: #00D4D4; }

    /* ── HUD sopra la scena AR ── */
    #hud {
      position: fixed; inset: 0; z-index: 100;
      pointer-events: none; display: none;
    }

    #hud-top {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: max(env(safe-area-inset-top), 1.2rem) 1.4rem 1rem;
      background: linear-gradient(to bottom, rgba(7,24,26,.85), transparent);
    }
    #hud-top svg { width: 88px; }

    #live {
      display: flex; align-items: center; gap: .4rem;
      font-size: .58rem; letter-spacing: .2em; color: #00B2B2;
      text-transform: uppercase;
      background: rgba(0,178,178,.1);
      border: 1px solid rgba(0,178,178,.3);
      padding: .3rem .7rem; border-radius: 20px;
    }
    #live-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #6DC82A; animation: blink 1.4s infinite;
    }
    @keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:.15; } }

    #toast {
      position: absolute; bottom: 5rem; left: 50%;
      transform: translateX(-50%);
      background: rgba(7,24,26,.75);
      border: 1px solid rgba(0,178,178,.4);
      backdrop-filter: blur(10px);
      padding: .55rem 1.3rem; border-radius: 20px;
      font-size: .65rem; letter-spacing: .14em; color: #00B2B2;
      text-transform: uppercase; white-space: nowrap;
      transition: color .3s, border-color .3s;
    }
    #toast.found { color: #6DC82A; border-color: rgba(109,200,42,.55); }

    #hint {
      position: absolute; bottom: 2.5rem; left: 0; right: 0;
      text-align: center; font-size: .62rem; letter-spacing: .15em;
      color: rgba(255,255,255,.35); text-transform: uppercase;
    }

    /* ── A-Frame occupa tutto lo schermo ── */
    a-scene {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100% !important; height: 100% !important;
      z-index: 1;
    }
  </style>
</head>
<body>

<!-- ══ SPLASH ══ -->
<div id="splash">
  <svg class="logo" viewBox="0 0 240 72" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="28" cy="36" r="24" stroke="#00B2B2" stroke-width="2.5" fill="none" opacity=".2"/>
    <circle cx="28" cy="36" r="15" stroke="#00B2B2" stroke-width="2.5" fill="none" opacity=".4"/>
    <circle cx="28" cy="36" r="7" fill="#00B2B2"/>
    <text x="60" y="47" fill="#fff" font-size="28" font-weight="700"
          font-family="Helvetica Neue,Arial,sans-serif" letter-spacing="-0.5">cellnex</text>
    <path d="M214 18 Q224 10 234 18" stroke="#00B2B2" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M218 25 Q224 19 230 25" stroke="#00B2B2" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <circle cx="224" cy="31" r="2.8" fill="#00B2B2"/>
  </svg>
  <h1>Cellnex <span>AR</span></h1>
  <p>Inquadra il panorama Cellnex di fronte a te</p>
  <button id="start-btn">&#9654;&nbsp; Avvia visione AR</button>
</div>

<!-- ══ HUD ══ -->
<div id="hud">
  <div id="hud-top">
    <svg viewBox="0 0 240 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="28" cy="36" r="24" stroke="#00B2B2" stroke-width="2.5" fill="none" opacity=".2"/>
      <circle cx="28" cy="36" r="15" stroke="#00B2B2" stroke-width="2.5" fill="none" opacity=".4"/>
      <circle cx="28" cy="36" r="7" fill="#00B2B2"/>
      <text x="60" y="47" fill="#fff" font-size="28" font-weight="700"
            font-family="Helvetica Neue,Arial,sans-serif" letter-spacing="-0.5">cellnex</text>
      <path d="M214 18 Q224 10 234 18" stroke="#00B2B2" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M218 25 Q224 19 230 25" stroke="#00B2B2" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="224" cy="31" r="2.8" fill="#00B2B2"/>
    </svg>
    <div id="live"><div id="live-dot"></div>AR Live</div>
  </div>
  <div id="toast">&#9675;&nbsp; Ricerca edificio in corso…</div>
  <div id="hint">Punta la fotocamera verso il palazzo</div>
</div>

<!-- ══ A-FRAME SCENE ══
     La scena è sempre presente nel DOM ma nascosta.
     MindAR viene avviato via JS dopo il click.
     Il logo parte con visible="false" e diventa true solo su targetFound.
-->
<a-scene
  id="ar-scene"
  mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.001; filterBeta: 1000; warmupTolerance: 1; missTolerance: 5"
  embedded
  renderer="colorManagement: true; physicallyCorrectLights: false"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  style="display: none;"
>
  <a-assets timeout="10000">
    <img id="cellnex-img" src="cellnex-telecom-logotransparent.png" crossorigin="anonymous" />
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>

  <!-- Target 0: prima (e unica) immagine in targets.mind -->
  <a-entity mindar-image-target="targetIndex: 0">

    <!--
      Il logo parte INVISIBILE.
      Quando il target viene trovato, JS lo rende visibile.
      position="0 0.6 0" → centrato orizzontalmente, alzato di 0.6 unità sopra il target.
      Modifica height in base alle proporzioni reali del tuo PNG.
      (Cellnex logo ≈ 4:1 → width=1.4, height=0.35)
    -->
    <a-image
      id="ar-logo"
      src="#cellnex-img"
      position="0 0.6 0"
      width="1.4"
      height="0.35"
      visible="false"
      material="transparent: true; alphaTest: 0.05; side: double; depthWrite: false"
    ></a-image>

  </a-entity>
</a-scene>

<script>
(function () {
  const splash   = document.getElementById('splash');
  const arScene  = document.getElementById('ar-scene');
  const hud      = document.getElementById('hud');
  const toast    = document.getElementById('toast');
  const startBtn = document.getElementById('start-btn');

  let started = false;

  startBtn.addEventListener('click', async () => {
    if (started) return;

    /* 1. Richiedi esplicitamente la fotocamera */
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      /* Rilascia subito: MindAR aprirà il proprio stream */
      stream.getTracks().forEach(t => t.stop());
    } catch (err) {
      alert('Fotocamera non disponibile. Controlla i permessi del browser e riprova.');
      return;
    }

    started = true;

    /* 2. Mostra la scena A-Frame */
    arScene.style.display = 'block';

    /* 3. Nascondi splash */
    splash.classList.add('hidden');

    /* 4. Avvia MindAR dopo che A-Frame ha inizializzato la scena */
    arScene.addEventListener('loaded', onSceneLoaded, { once: true });

    /* Se la scena era già loaded prima del click (caso raro) */
    if (arScene.hasLoaded) onSceneLoaded();
  });

  function onSceneLoaded() {
    /* Avvia il sistema MindAR (apre la fotocamera) */
    const mindARSystem = arScene.systems['mindar-image-system'];
    mindARSystem.start();

    /* Mostra HUD */
    hud.style.display = 'block';

    /* Ascolta gli eventi sul target */
    const targetEntity = arScene.querySelector('[mindar-image-target]');
    const arLogo       = document.getElementById('ar-logo');

    targetEntity.addEventListener('targetFound', () => {
      /* Rendi il logo visibile solo ora */
      arLogo.setAttribute('visible', 'true');
      toast.textContent = '✓ Edificio Cellnex riconosciuto';
      toast.classList.add('found');
    });

    targetEntity.addEventListener('targetLost', () => {
      /* Nascondi il logo quando il target esce dal campo visivo */
      arLogo.setAttribute('visible', 'false');
      toast.textContent = '○ Ricerca edificio in corso…';
      toast.classList.remove('found');
    });
  }

  /* Blocca scroll accidentale su mobile */
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
})();
</script>

</body>
</html>
